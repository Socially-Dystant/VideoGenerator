services:
  - type: web
    name: videogenerator-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    buildFilter:
      paths:
        - server/**
        - Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OFOX_API_KEY
        sync: false
      - key: APP_TOKEN
        generateValue: true
      - key: OFOX_VIDEO_MODEL
        value: alibaba/wan-3.0-prime
      - key: AGE_CHECK_MODEL
        value: openai/gpt-4o-mini
      - key: IMAGE_DELIVERY
        value: url
